[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gvm-combinations"
version = "0.1.0"
description = "Gamma Variance Model for combining correlated measurements"
readme = "PYPI_README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Enzo Canonero" }]
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "PyYAML",
    "iminuit",
    "scipy",
    "matplotlib",
]

[project.optional-dependencies]
dev = [
    "mypy",
    "pytest",
    "ruff",
]

[project.urls]
Repository = "https://github.com/EnzoCanonero/gvm-combinations"
Issues = "https://github.com/EnzoCanonero/gvm-combinations/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
files = ["src", "scripts", "tests"]
disallow_untyped_defs = true
disable_error_code = ["import-untyped"]

[tool.ruff.lint]
select = ["E4", "E7", "F"]
